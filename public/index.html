<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.34/moment-timezone-with-data.min.js"></script>
    <title>Dashboard</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        #container {
            border: 1px solid black;
            width: 605px;
            height: 695px;
            margin: auto auto;
        }

        #inner-container {
            height: 604px;
            width: 695px;
            border: 1px solid gray;
            -webkit-transform: rotate(90deg) translateY(-100%);
            -webkit-transform-origin: top left;
        }

        .uv-line {
            position: absolute;
            top: 151px;
            left: 18px;
            width: 284px;
            height: 2px;
            background-color: black;
        }

        .image-container {
            text-align: center;
            position: relative;
            display: inline-block;
        }
        .caption {
            font-size: 18px;
            color: #555;
            margin-bottom: 10px;
        }

        table {
            margin: 0 auto;
        }

        footer {
            position: absolute;
            bottom: 0;
        }

        .footer-buttons {
            position: relative;
            margin: 0 auto;
        }

        .weekdays img {
            width: 80px;
        }

        .task-buttons img {
            width: 80px;
            padding: 5px;
            cursor: pointer;
        }

        .weekdays th {
            font-size: smaller;
        }

        .current-weekday {
            background-color: #ccc;
        }

        .current {
            background-color: #ccc;
            border-radius: 8px;
            padding: 5px;
        }

        .days-until-bears img {
            width: 40px;
        }

        .time-of-days img {
            width: 40px;
        }

        .button {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            color: #fff;
            background-color: #ccc;
            border: none;
            border-radius: 5px;
            margin: 5px;
        }

        .current-link {
            background-color: #007BFF;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="inner-container">
            <table class="weather">
                <a class="weatherwidget-io" href="https://forecast7.com/en/60d4522d27/turku/" data-label_1="TURKU" data-mode="Current" data-days="3" >TURKU</a>
                <script>
                !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src='https://weatherwidget.io/js/widget.min.js';fjs.parentNode.insertBefore(js,fjs);}}(document,'script','weatherwidget-io-js');
                </script>
            </table>

            <hr/>

            <div style="width: 50%; float: left;">
                <table>
                    <tr>
                        <td class="image-container">
                            <div class="caption">UV tänään</div>
                            <div class="uv-line"></div>
                            <img src="https://cdn.fmi.fi/apps/global-ultraviolet-index/plot.php?location=ut&lang=fi&day=0" alt="UV tänään">
                        </td>
                    </tr>
                </table>
            </div>

            <div style="width: 50%; float: right;">
                <table class="task-buttons">
                    <tr>
                        <td style="width: 50%">
                            <div class="caption">Tehtävät</div>
                            <img id="watering-icon" src="images/droplet.png" alt="Water flowers">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <div class="caption">Koulu alkaa</div>
                            <span id="school-countdown"></span>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <div class="caption">Myyrät alkaa</div>
                            <span id="moles-countdown"></span>
                        </td>
                    </tr>
                </table>
            </div>

            <hr style="clear:both"/>

            <table class="weekdays" style="width: 90%;">
                <tbody>
                <tr>
                    <td><img src="images/worm.png" alt="Worm"></td>
                    <td><img src="images/tiger.png" alt="Tiger"></td>
                    <td><img src="images/fox.png" alt="Fox"></td>
                    <td><img src="images/cockroach.png" alt="Cockroach"></td>
                    <td><img src="images/raccoon.png" alt="Raccoon"></td>
                    <td><img src="images/sloth.png" alt="Sloth"></td>
                    <td><img src="images/wolf.png" alt="Wolf"></td>
                </tr>
                </tbody>
                <tfoot>
                <tr>
                    <td>MA</td>
                    <td>TI</td>
                    <td>KE</td>
                    <td>TO</td>
                    <td>PE</td>
                    <td>LA</td>
                    <td>SU</td>
                </tr>
                </tfoot>
            </table>

            <hr/>

            <table class="time-of-days">
                <tbody>
                <tr>
                    <td><img src="images/sunrise-bw.png" alt="Morning"></td>
                    <td><img src="images/day-bw.png" alt="Day"></td>
                    <td><img src="images/sunset-bw.png" alt="Sunset"></td>
                    <td><img src="images/moon.png" alt="Night"></td>
                    <td></td>
                </tr>
                </tbody>
            </table>

            <footer>
                <div class="footer-buttons">
                    <a href="index.html" class="button">5 min</a>
                    <a href="index.html?refresh=5" class="button">5 sec</a>
                    <div id="debug"></div>
                </div>
            </footer>
        </div>
    </div>

    <script>
        function handleRefresh() {
            var qd = {};
            if (location.search) location.search.substr(1).split("&").forEach(function(item) {
                var s = item.split("="), k = s[0], v = s[1] && decodeURIComponent(s[1]); (qd[k] = qd[k] || []).push(v)
            })

            var refreshSeconds = qd.refresh
            if (!refreshSeconds) {
                refreshSeconds = 5*60
            }

            if (location.href.indexOf("?refresh") !== -1) {
                var chosen = document.querySelectorAll('a[href="index.html?refresh=' + refreshSeconds + '"]')
                chosen[0].className += ' current-link'
            } else {
                var first = document.querySelectorAll('a[href="index.html"]')
                first[0].className += ' current-link'
            }

            setTimeout(function () {
                location.reload();
            }, refreshSeconds * 1000); // Refresh the page at the specified interval
        }

        handleRefresh();

        function highlightWeekDay() {
            function getNthAnimalCell(n) {
                var animalCells = document.querySelectorAll('table.weekdays tbody tr td');
                console.log(animalCells)
                return animalCells[n];
            }

            const weekMap = {
                1: 0, // → monday
                2: 1, // → tuesday
                3: 2, // → wednesday
                4: 3, // → thursday
                5: 4, // → friday
                6: 5, // → saturday
                0: 6, // → sunday
            };

            var day = weekMap[(new Date()).getDay()]

            var nthCell = getNthAnimalCell(day);
            if (nthCell) {
                nthCell.className += ' current-weekday'
            }
        }

        highlightWeekDay();

        function highlightTimeOfDay() {
            function isNumberInRange(n) {
                return n >= 1 && n <= 4;
            }

            function getTimeOfDayIndex() {
                var hour = moment().hour();

                if (hour < 7 || hour >= 21) {
                    return 4;
                }

                if (hour < 12) {
                    return 1;
                }

                if (hour < 18) {
                    return 2;
                }

                if (hour < 22) {
                    return 3;
                }
            }

            function getNthImage(n) {
                var cells = document.querySelectorAll('table.time-of-days td');
                return cells[n - 1];
            }

            var n = getTimeOfDayIndex();

            if (isNumberInRange(n)) {
                var nthCell = getNthImage(n);
                if (nthCell) {
                    nthCell.className += ' current'
                }
            }
        }

        highlightTimeOfDay();

        function setupWateringIcon() {
            var icon = document.getElementById('watering-icon');
            var storageKey = 'wateringDate';

            function today() {
                var d = new Date();
                function pad(n) { return ('0' + n).slice(-2); }
                return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
            }

            function setChecked(checked) {
                icon.className = !checked ? 'current' : undefined;
            }

            icon.addEventListener('click', function () {
                var stored = localStorage.getItem(storageKey);
                if (stored === today()) {
                    setChecked(false);
                    localStorage.removeItem(storageKey);
                    return;
                } else {
                    localStorage.setItem(storageKey, today());
                    setChecked(true);
                }
            });

            var stored = localStorage.getItem(storageKey);
            setChecked(stored === today());
        }

        setupWateringIcon();

        function updateCountdown(targetDate, elementId) {
            var now = moment.tz('Europe/Helsinki').startOf('day');
            var target = moment.tz(targetDate, 'YYYY-MM-DD', 'Europe/Helsinki').startOf('day');
            var diff = target.diff(now, 'days');
            var el = document.getElementById(elementId);
            if (el) {
                el.textContent = diff;
            }
        }

        updateCountdown('2025-08-07', 'school-countdown');
        updateCountdown('2025-08-04', 'moles-countdown');
    </script>
</body>
</html>
